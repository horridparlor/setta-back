services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html/
      - ../setta-assets:/var/www/setta-assets
    ports:
      - "8000:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: setta
      MYSQL_USER: setta_user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
  assets:
    image: nginx:latest
    volumes:
      - ../setta-assets:/usr/share/nginx/html:ro
    ports:
      - "8010:80"
    restart: always

volumes:
  mysql_data:
